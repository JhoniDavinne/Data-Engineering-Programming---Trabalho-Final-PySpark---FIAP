[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-final-pedidos-recusados-legitimos"
version = "1.0.0"
description = "Pipeline PySpark que gera o relatório de pedidos recusados e legítimos (FIAP - Data Engineering Programming)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Aluno FIAP - Data Engineering Programming" }
]
keywords = ["pyspark", "data-engineering", "fiap", "etl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyspark>=3.5,<4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-sugar>=1.0.0",
]

[project.scripts]
projeto-final = "pipeline.cli:run_pipeline"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-v",
    "--tb=short",
    "-ra",
    "--color=yes",
    "--durations=5",
]
testpaths = ["tests"]
